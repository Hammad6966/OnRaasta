name: onraasta
description: OnRaasta - On-demand roadside assistance app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - .env
